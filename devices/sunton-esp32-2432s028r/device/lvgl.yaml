# =============================================================================
# LVGL MAIN PAGE - Top-layer HUD and button grid
# =============================================================================
# Defines the primary UI: a top-layer overlay with temperature and clock
# labels, and the main page containing a 2x2 grid of 4 button widgets.
# 320x240 leaves room for four readable cards per page; subpage cards
# provide additional capacity beyond the main grid.
# pad_top clears the top-layer clock bar with a little breathing room.
# sensors.yaml unhides and places active ones at boot via grid cell coords.
# =============================================================================

lvgl:
  # ---------------------------------------------------------------------------
  # Top layer (always visible above all pages)
  # ---------------------------------------------------------------------------
  top_layer:
    widgets:
      # Indoor/outdoor temperature (top-left)
      - label:
          text: "-°C"
          id: temperatures
          text_font: font_text_body
          align: top_left
          x: 6
          y: 5
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_2
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_3
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_4
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_5
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_6
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      # Clock (top-center, updated every minute by time.yaml)
      - label:
          text: "--:--"
          id: display_time
          text_font: font_text_body
          align: top_mid
          x: 0
          y: 5
          text_align: center
          text_color: 0xFFFFFF
          hidden: true
      # Weather status (small icon in the clock bar)
      - obj:
          id: clock_bar_weather_icon_container
          align: top_right
          x: -8
          y: 1
          width: 36
          height: 28
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: false
          hidden: true
          widgets:
            - label:
                text: "\U000F0590"
                id: clock_bar_weather_icon_label
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF
      # Page navigation arrows (flank the clock; visible once subpages exist,
      # cycling main page <-> subpages laterally for small-screen capacity)
      - obj:
          id: page_nav_left_button
          align: top_mid
          x: -58
          y: 0
          width: 40
          height: 30
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                text: "\U000F0141"
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF
          on_press:
            then:
              - lambda: 'espcontrol_navigate_adjacent(-1, id(main_page));'
      - obj:
          id: page_nav_right_button
          align: top_mid
          x: 58
          y: 0
          width: 40
          height: 30
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                text: "\U000F0142"
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF
          on_press:
            then:
              - lambda: 'espcontrol_navigate_adjacent(1, id(main_page));'
      # Network status (tappable, right side of clock bar)
      - obj:
          id: network_status_button
          align: top_right
          x: -8
          y: 1
          width: 36
          height: 28
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                id: network_status_icon_label
                text: "\U000F0928"
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF
          on_press:
            then:
              - script.execute: network_status_open_info

  # ---------------------------------------------------------------------------
  # Main page (fixed 2x2 grid of button widgets)
  # ---------------------------------------------------------------------------
  pages:
    - id: main_page
      scrollbar_mode: "off"
      layout:
        type: grid
        grid_columns: [FR(1), FR(1)]
        grid_rows: [FR(1), FR(1)]
        pad_row: ${main_page_card_gap}
        pad_column: ${main_page_card_gap}
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: ${main_page_pad_top}
      pad_bottom: 4
      pad_left: 5
      pad_right: 5

      widgets:
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "1" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "2" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "3" } }
        - !include { file: ../../../common/device/button_widget.yaml, vars: { num: "4" } }
