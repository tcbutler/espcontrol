# =============================================================================
# DEVICE - Sunton ESP32-2432S028R "Cheap Yellow Display" hardware definition
# =============================================================================
# Pin assignments, peripherals, and platform config for the 2.8" 320x240
# panel. Plain ESP32-WROOM-32 with NO PSRAM and 4MB flash, so this target
# runs everything from internal RAM: keep LVGL buffers small and avoid
# PSRAM-dependent features (image cards stay disabled in the manifest).
#
# Defaults target the dual-USB (micro-USB + USB-C) board revision, which
# ships an ST7789 panel with inverted colors. For the original single
# micro-USB revision override:
#   cyd_display_model: "ILI9341", cyd_display_invert: "false"
# =============================================================================

substitutions:
  espcontrol_component_url: "https://github.com/tcbutler/espcontrol"
  espcontrol_component_ref: "cyd-support"
  # Dual-USB board revision defaults (ST7789 panel, inverted colors)
  cyd_display_model: "ST7789V"
  cyd_display_invert: "true"

# ---------------------------------------------------------------------------
# ESP32 platform (4MB flash, no PSRAM, ESP-IDF framework)
# ---------------------------------------------------------------------------
esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    version: 5.5.2
    source: https://github.com/pioarduino/esp-idf/releases/download/v5.5.2/esp-idf-v5.5.2.tar.xz
    platform_version: 55.03.37
    sdkconfig_options:
      # Keep the ESP32 task watchdog long enough for display startup while
      # remaining compatible with ESPHome 2026.4 and newer.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # Optimize for size: the 4MB flash leaves little headroom for the
      # OTA-capable dual-app partition layout.
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "y"
      # No PSRAM: WiFi, LVGL widgets, and the web UI all share 320KB of
      # internal RAM. Default WiFi buffering exhausts it during the
      # unprovisioned AP+scan phase (LVGL allocs of ~200 bytes fail and the
      # draw loop trips the task watchdog). Slim the radio's RAM footprint;
      # throughput loss is irrelevant for a control panel.
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "4"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "8"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "8"
      CONFIG_ESP_WIFI_AMPDU_TX_ENABLED: "n"
      CONFIG_ESP_WIFI_AMPDU_RX_ENABLED: "n"
      CONFIG_ESP_WIFI_RX_MGMT_BUF_NUM_DEF: "4"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "2880"
      CONFIG_LWIP_TCP_WND_DEFAULT: "2880"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "6"
      CONFIG_LWIP_UDP_RECVMBOX_SIZE: "6"

# ---------------------------------------------------------------------------
# External component
# ---------------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: ${espcontrol_component_url}
      ref: ${espcontrol_component_ref}
      path: components
    components: [espcontrol, web_server_idf, artwork_image]
    refresh: 1s

espcontrol:

# ---------------------------------------------------------------------------
# ESPHome core (device name from substitutions)
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags:
      - "-DESPCONTROL_DISABLE_TODO=1"
      - "-DESPCONTROL_MAX_GRID_SLOTS=4"
      # 4MB flash: drop the 18-language translation tables; UI stays English.
      - "-DESPCONTROL_I18N_ENGLISH_ONLY=1"
      # No PSRAM: the web config server only runs while setup mode is on.
      - "-DESPCONTROL_WEB_DEFERRED=1"
  on_boot:
    - priority: -100
      then:
        - lambda: 'id(screen_rotation_ready) = true;'
        - script.execute: clock_bar_apply
    # After every component is up: a panel with no cards configured is mid
    # onboarding, so bring the web config UI (and captive portal) online.
    - priority: -300
      then:
        - lambda: |-
            bool configured = !id(button_1_config).state.empty() ||
                              !id(button_2_config).state.empty() ||
                              !id(button_3_config).state.empty() ||
                              !id(button_4_config).state.empty();
            if (!configured) {
              ESP_LOGI("setup_mode", "No cards configured yet; starting web setup mode");
              id(web_setup_mode).turn_on();
            }

# ---------------------------------------------------------------------------
# OTA updates (ESPHome native + HTTP-based)
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed
  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  id: cyd_2432s028r_safe_mode
  boot_is_good_after: 10s

# ---------------------------------------------------------------------------
# Shared infrastructure (API, logging, web server, restart button)
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

# Serve the per-device web UI bundle from this fork until the device is
# published upstream (core_infra pins the upstream repo hash). jsDelivr needs
# a commit ref (branch refs 502); bump the hash when www.js changes.
web_server:
  js_url: https://cdn.jsdelivr.net/gh/tcbutler/espcontrol@fd369c0714eea71cccdd1d8db047eb9aef5a3a88/docs/public/webserver/${device_slug}/www.js?v=${firmware_version}

# Everything shares the ~300KB of internal RAM on this panel: WiFi, LVGL,
# the web UI, and the API. Keep the native API connection pool modest.
api:
  listen_backlog: 4
  max_connections: 3
  max_send_queue: 12

# CYD boards brown out their USB-serial chip when the radio transmits at
# full power; 8.5dB is the community-standard fix and plenty for indoor use.
wifi:
  output_power: 8.5dB

logger:
  hardware_uart: UART0
  # INFO strips debug-level format strings from flash; the 4MB OTA layout
  # needs the headroom. Raise locally when debugging.
  level: INFO

# ---------------------------------------------------------------------------
# Backlight (LEDC PWM output + monochromatic light entity)
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO21
    id: gpio_backlight_pwm
    frequency: 1000Hz
    zero_means_zero: true
  # RGB status LED channels (common-anode, active-low)
  - platform: ledc
    pin: GPIO4
    id: cyd_led_red
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: cyd_led_green
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: cyd_led_blue
    inverted: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                auto now = panel_time_or_fallback(id(panel_time).now(), id(homeassistant_time).now());
                return (id(screen_schedule_asleep) &&
                        !screen_schedule_clock_mode(id(schedule_mode).current_option())) ||
                       screen_schedule_waiting_for_time(
                         id(screen_schedule_trigger).state,
                         id(schedule_enabled).state,
                         now.is_valid());
            then:
              - script.execute: backlight_force_display_off
            else:
              - if:
                  condition:
                    lambda: 'return id(screensaver_display_off_active);'
                  then:
                    - script.execute: screensaver_wake
    on_turn_off:
      then:
        - if:
            condition:
              lambda: |-
                return !id(display_asleep) &&
                       !id(screen_schedule_asleep) &&
                       !id(screensaver_display_off_active) &&
                       !id(screensaver_dimmed_active);
            then:
              - script.execute: screen_schedule_manual_sleep

  # Onboard RGB status LED (rear, active-low)
  - platform: rgb
    name: Status LED
    entity_category: config
    id: cyd_status_led
    icon: mdi:led-outline
    red: cyd_led_red
    green: cyd_led_green
    blue: cyd_led_blue
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s

# ---------------------------------------------------------------------------
# Web setup mode: the config web UI's httpd only runs while this is on, so
# its RAM goes back to LVGL and the API during normal panel use. Auto-starts
# on unconfigured panels (see on_boot) and is exposed to Home Assistant.
# ---------------------------------------------------------------------------
switch:
  - platform: template
    name: Web Setup Mode
    id: web_setup_mode
    icon: mdi:web-box
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          if (esphome::web_server_idf::espcontrol_web_server_set_active(true)) {
            ESP_LOGI("setup_mode", "Web setup mode on: http://%s", network::get_use_address());
          } else {
            ESP_LOGW("setup_mode", "Web server not initialized yet");
          }
    on_turn_off:
      - lambda: |-
          esphome::web_server_idf::espcontrol_web_server_set_active(false);
          ESP_LOGI("setup_mode", "Web setup mode off; RAM returned to the panel");

# ---------------------------------------------------------------------------
# Ambient light sensor (LDR on GPIO34, brighter = lower reading)
# ---------------------------------------------------------------------------
sensor:
  - platform: adc
    pin: GPIO34
    name: Ambient Light
    icon: mdi:brightness-5
    id: cyd_ambient_light
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "V"
    accuracy_decimals: 2

# ---------------------------------------------------------------------------
# SPI buses (display on HSPI pins, touch controller on its own bus)
# ---------------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# ---------------------------------------------------------------------------
# Touchscreen (XPT2046 resistive, wakes screensaver on touch)
# ---------------------------------------------------------------------------
touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    display: my_display
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: true
    on_touch:
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display (2.8" 320x240 SPI panel, landscape with USB ports on the right)
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    model: ${cyd_display_model}
    id: my_display
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    data_rate: 40MHz
    invert_colors: ${cyd_display_invert}
    update_interval: never
    auto_clear_enabled: false
    show_test_card: false
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: true

# ---------------------------------------------------------------------------
# LVGL base (display binding, must be before any page definitions)
# ---------------------------------------------------------------------------
# buffer_size 12% keeps the draw buffer near 18KB; the full 320x240 frame
# would not fit alongside WiFi and the web UI in internal RAM.
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  setup_priority: 230
  buffer_size: 12%
  displays: my_display
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 3s

# Show the page navigation arrows only while a carousel page (main grid or
# a subpage) is active and at least one subpage exists to navigate to.
interval:
  - interval: 1s
    then:
      - lambda: |-
          const bool show = !navigation_subpages().empty() &&
                            espcontrol_on_carousel_page(id(main_page)->obj);
          const bool hidden_now = lv_obj_has_flag(id(page_nav_left_button), LV_OBJ_FLAG_HIDDEN);
          if (show && hidden_now) {
            lv_obj_clear_flag(id(page_nav_left_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(page_nav_right_button), LV_OBJ_FLAG_HIDDEN);
          } else if (!show && !hidden_now) {
            lv_obj_add_flag(id(page_nav_left_button), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(page_nav_right_button), LV_OBJ_FLAG_HIDDEN);
          }

script:
  - id: cyd_status_led_flash
    mode: restart
    then:
      - light.turn_on:
          id: cyd_status_led
          red: 0%
          green: 30%
          blue: 0%
      - delay: 300ms
      - light.turn_off: cyd_status_led
