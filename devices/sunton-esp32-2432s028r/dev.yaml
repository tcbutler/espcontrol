# =============================================================================
# DEV CONFIG - Local development entry point (2.8" CYD)
# =============================================================================
# Flash with: esphome run dev.yaml
# Components are pulled from the local checkout; commit C++ changes before
# compiling so the git-sourced external_components see them.
# =============================================================================

substitutions:
  name: "espcontrol-cyd"
  friendly_name: "EspControl CYD"
  # ESPHome's git source needs an absolute file:// URL for local checkouts.
  espcontrol_component_url: "file:///Users/tom/Documents/Coding/CYDespControl"
  espcontrol_component_ref: "HEAD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name}"

captive_portal:

# Bench-only heap tracer (sensor updates don't log at INFO level).
interval:
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("heap", "free=%u min=%u largest=%u",
                   heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                   heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL),
                   heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));
  # Bench-only layer hunter: name every LVGL object that forces a
  # compositing layer (the 42KB allocs that crash no-PSRAM boards).
  - interval: 10s
    then:
      - lambda: |-
          struct LayerScan {
            static void walk(lv_obj_t *obj, int depth) {
              if (obj == nullptr) return;
              // Same predicates LVGL's calculate_layer_type() uses.
              int rot = (int) lv_obj_get_style_transform_rotation(obj, LV_PART_MAIN);
              int sx = (int) lv_obj_get_style_transform_scale_x(obj, LV_PART_MAIN);
              int sy = (int) lv_obj_get_style_transform_scale_y(obj, LV_PART_MAIN);
              int opa = (int) lv_obj_get_style_opa(obj, LV_PART_MAIN);
              int blend = (int) lv_obj_get_style_blend_mode(obj, LV_PART_MAIN);
              bool is_transform = (rot != 0) || (sx != 256) || (sy != 256);
              bool is_simple = (opa < 255) || (blend != 0);
              if (is_transform || is_simple) {
                const lv_obj_class_t *cls = lv_obj_get_class(obj);
                const char *cls_name = "?";
                if (cls == &lv_obj_class) cls_name = "obj";
                else if (cls == &lv_button_class) cls_name = "button";
                else if (cls == &lv_label_class) cls_name = "label";
                else if (cls == &lv_slider_class) cls_name = "slider";
                else if (cls == &lv_bar_class) cls_name = "bar";
                else if (cls == &lv_arc_class) cls_name = "arc";
                ESP_LOGW("layerscan",
                  "LAYER obj=%p cls=%s size=%dx%d %s opa=%d sx=%d sy=%d rot=%d blend=%d hidden=%d d=%d",
                  obj, cls_name,
                  (int) lv_obj_get_width(obj), (int) lv_obj_get_height(obj),
                  is_transform ? "TRANSFORM" : "SIMPLE",
                  opa, sx, sy, rot, blend,
                  lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN) ? 1 : 0, depth);
              }
              uint32_t n = lv_obj_get_child_count(obj);
              for (uint32_t i = 0; i < n; i++) walk(lv_obj_get_child(obj, i), depth + 1);
            }
          };
          LayerScan::walk(lv_screen_active(), 0);
          LayerScan::walk(lv_layer_top(), 0);

packages:
  espcontrol: !include packages.yaml
